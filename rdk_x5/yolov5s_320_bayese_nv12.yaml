# ============================================================
# RDK X5 (旭日X5) YOLOv5s@320 模型转换配置
# 工具链: OpenExplorer v1.2.8 (hb_mapper 1.24.3)
# 参考: rdk_model_zoo yolov5_detect_bayese_640x640_nv12.yaml
# 用法: hb_mapper makertbin --model-type onnx --config yolov5s_320_bayese_nv12.yaml
# ============================================================

model_parameters:
  onnx_model: './rdk_yolov5s_320.onnx'   # export_rdk_onnx.py 产物（与 yaml 同目录）
  march: "bayes-e"                 # ★ X5 专属; X3=bernoulli2, Ultra/J5=bayes
  layer_out_dump: False
  working_dir: 'output/yolov5s_320_bayese_nv12'
  output_model_file_prefix: 'yolov5s_320_bayese_nv12'

input_parameters:
  input_type_rt: 'nv12'            # 板端输入: NV12 (BPU 最优)
  input_type_train: 'rgb'          # 训练/校准输入: RGB
  input_layout_train: 'NCHW'
  norm_type: 'data_scale'          # YOLOv5 无均值减法, 仅缩放
  scale_value: 0.003921568627451   # = 1/255, 校准数据保持 0~255 原始值!

calibration_parameters:
  cal_data_dir: './calibration_data_rgb_f32_320'   # prepare_calib_data.py 产物
  cal_data_type: 'float32'
  calibration_type: 'default'

compiler_parameters:
  compile_mode: 'latency'          # 延时优先
  debug: False
  optimize_level: 'O3'
